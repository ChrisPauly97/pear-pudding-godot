name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6-stable

jobs:
  test:
    name: Headless import + test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      # The project ships no .godot/ directory, so every clean checkout must
      # import before any PNG/.tres preload() can resolve. Skipping this makes
      # ~30 tests fail with parse errors that look like real bugs.
      - name: Import project (headless)
        run: godot --headless --editor --quit 2>&1 | tee /tmp/import.log || true

      # A single parse error silently breaks every scene that preloads the file,
      # so this is gated separately from the test run for a clearer failure.
      - name: Fail on parse / compile errors
        run: |
          ERRORS=$(grep -iE "Parse Error|Compile Error|Failed to load script" /tmp/import.log \
            | grep -viE "imported/|Make sure resources" || true)
          if [ -n "$ERRORS" ]; then
            echo "::error::Import produced parse/compile errors:"
            echo "$ERRORS"
            exit 1
          fi
          echo "Import clean — no parse or compile errors."

      # project.godot makes unsafe_method_access / unsafe_property_access errors,
      # so a member the analyzer can't prove exists is a parse error. The editor
      # import above doesn't compile every script, so load them all explicitly.
      - name: Check unsafe member access
        run: scripts/unsafe-hits.sh

      # GDScript has no exceptions: a runtime error aborts the test function
      # before its asserts run, and the runner still counts it as a pass. Any
      # SCRIPT ERROR in the log is therefore a test that silently tested nothing.
      - name: Run test suite
        run: |
          set -o pipefail
          godot --headless --path . -s tests/runner.gd 2>&1 | tee /tmp/tests.log
          ERRORS=$(grep -A2 "SCRIPT ERROR" /tmp/tests.log || true)
          if [ -n "$ERRORS" ]; then
            echo "::error::Test run logged runtime script errors:"
            echo "$ERRORS"
            exit 1
          fi

      # The unit runner is synchronous, so it can never call _ready() on a
      # mounted node or let a layout settle. These two stand up the real scenes
      # and drive frames, which is the only way layout and RPC-dispatch bugs
      # surface — both classes look like clean passes to the suite above.
      # coop_pve_ai_turn_smoke stands up a real co-op BattleScene without peers.
      # The net_*_smoke tests are deliberately not here: they need ENet loopback.
      # Same SCRIPT ERROR gate as the suite: a smoke test can exit 0 while its
      # scene logs runtime errors (the battle view once rendered against a null
      # GameState in every networked and resumed battle, and no one noticed).
      - name: Run scene smoke tests
        run: |
          set -o pipefail
          for t in world_scene_smoke menu_hub_smoke spire_draft_smoke coop_pve_ai_turn_smoke realtime_battle_smoke in_world_battle_smoke net_attack_replay_smoke; do
            godot --headless --path . -s tests/$t.gd 2>&1 | tee /tmp/$t.log
            ERRORS=$(grep -A2 "SCRIPT ERROR" /tmp/$t.log || true)
            if [ -n "$ERRORS" ]; then
              echo "::error::$t logged runtime script errors:"
              echo "$ERRORS"
              exit 1
            fi
          done

  lint:
    name: gdlint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gdtoolkit
        # Pinned: an unpinned install drifted the rule set between runs (BID-053).
        run: pip install gdtoolkit==4.5.0

      # Gating (BID-053). Oversized files carry a file-level
      # `# gdlint: disable=max-file-lines` pragma as tracked debt; new files
      # are held to the limits in .gdlintrc.
      - name: Run gdlint
        run: gdlint $(git ls-files '*.gd')
